[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lenapi"
version = "0.1.0"
description = "A small, typed ASGI web framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
server = ["uvicorn[standard]>=0.30,<1"]
redis = ["redis>=5,<7"]
faker = ["Faker>=30,<41"]
ai = ["httpx>=0.27,<1"]
payments = ["httpx>=0.27,<1"]
test = ["pytest>=8,<9", "aiosqlite>=0.20"]
async-postgres = ["asyncpg>=0.29"]
async-mysql = ["asyncmy>=0.2"]
mongodb = ["pymongo>=4.13,<5"]

[project.scripts]
lenora = "lenapi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lenapi*"]

[tool.pytest.ini_options]
testpaths = ["tests", "app/student_api"]
python_files = ["test.py", "test_*.py", "*_test.py"]
addopts = "-ra"
