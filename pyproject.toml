[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lenapi"
version = "0.1.2"
description = "A modern ASGI framework with Pydantic validation, sync and async database access, WebSockets, authentication, and integrated API documentation."
authors = [
    {name = "Ifeanyi M. Onovo", email = "ifeanyi@maekandex.com.ng"},
    {name = "Maekandex Communication Limitation"},
]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Framework :: AsyncIO",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.7,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "alembic>=1.13,<2",
    "aiosqlite>=0.20",
    "uvicorn>=0.30,<1",
    "httpx>=0.27,<1",
    "pytest>=9.0.3,<10",
]

[project.optional-dependencies]
mysql = ["pymysql>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
redis = ["redis>=5,<7"]
faker = ["Faker>=30,<41"]
ai = ["httpx>=0.27,<1"]
test = ["pytest>=9.0.3,<10", "aiosqlite>=0.20"]
async-postgres = ["asyncpg>=0.29"]
async-mysql = ["asyncmy>=0.2"]
mongodb = ["pymongo>=4.13,<5"]
monitoring = ["psutil>=5.9,<8"]

[project.scripts]
lenora = "lenapi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["lenapi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test.py", "test_*.py", "*_test.py"]
addopts = "-ra"

[project.urls]
Homepage = "https://github.com/Mikandex/lenapi"
Repository = "https://github.com/Mikandex/lenapi"
Documentation = "https://github.com/Mikandex/lenapi_documentation"
Issues = "https://github.com/Mikandex/lenapi/issues"
